<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terima kasih, adik-adik PKL</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2438;--paper:#eef0f3;--card:#fff;--blue:#7f9cc0;--sand:#d9b98a;--rust:#b86f62;--mute:#5f677c;--line:#d5d9e2}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;overflow-x:hidden}
.hand{font-family:'Caveat',cursive;font-weight:700}
section{padding:5rem 1.25rem;max-width:980px;margin:auto}
h2{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;line-height:1.15;margin-bottom:.5rem}
.lead{color:var(--mute);max-width:52ch;margin-bottom:3rem}

/* ── HERO ── */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--ink);color:#fff;max-width:none;position:relative;overflow:hidden}
#hero::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(127,156,192,.22),transparent 70%);top:-180px;right:-140px}
.lanyard{width:44px;height:140px;background:repeating-linear-gradient(90deg,var(--blue) 0 8px,#6b88ad 8px 10px);margin-bottom:-14px;position:relative;z-index:1}
.badge{position:relative;width:min(420px,88vw);perspective:1200px;transform-origin:top center;animation:swing 5s ease-in-out infinite;cursor:pointer}
.badge .inner{display:grid;transition:transform .9s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.badge.flipped .inner{transform:rotateY(180deg)}
.badge.flipped{animation-play-state:paused}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);color:var(--ink);border-radius:20px;padding:2.4rem 1.3rem 1.4rem;box-shadow:0 30px 60px rgba(0,0,0,.45);position:relative}
.face::before{content:'';position:absolute;top:13px;left:50%;width:54px;height:9px;margin-left:-27px;border-radius:6px;background:var(--ink);opacity:.8}
.face.back{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4rem;background:var(--sand)}
.back .big{font-size:2.2rem;font-weight:800;line-height:1.1}
.back .stamp{position:static;transform:rotate(-8deg);opacity:1;margin:.8rem 0;font-size:1.6rem}
@keyframes swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.badge .photo{width:100%;border-radius:12px;margin-bottom:1rem;border:4px solid var(--sand);overflow:hidden;background:var(--paper);display:flex;justify-content:center}
.badge .photo img{width:auto;max-width:100%;height:auto;max-height:52vh;object-fit:contain}
.badge .photo.empty{aspect-ratio:4/3}
.badge b{display:block;font-size:1.2rem;font-weight:800;line-height:1.3}
.badge small{color:var(--mute)}
.back small{color:var(--ink);opacity:.7}
.stamp{border:4px solid var(--rust);color:var(--rust);font-weight:800;padding:.1rem .7rem;border-radius:8px;background:rgba(255,255,255,.9)}
.barcode{height:38px;width:80%;margin-top:.8rem;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 12px,transparent 12px 14px,var(--ink) 14px 15px,transparent 15px 19px)}
#hero h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:800;line-height:1.1;margin-top:2.4rem;max-width:18ch}
#hero p{color:#aab4cc;margin-top:.7rem;max-width:44ch}
.hint{margin-top:1.4rem;font-size:1.5rem;color:var(--sand)}

/* ── FOTO ── */
.slot{background:#d9dfea;position:relative;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.empty::after{content:attr(data-path);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:.5rem;font-size:.72rem;color:var(--mute);border:2px dashed #a9b3c9;word-break:break-all}

/* ── KARTU ID PER ORANG ── */
.ids{display:flex;flex-wrap:wrap;justify-content:center;gap:2.6rem 1.8rem}
.id{width:min(200px,44vw);display:flex;flex-direction:column;align-items:center;transform-origin:top center;cursor:pointer}
.id .strap{width:22px;height:56px;background:var(--blue);border-radius:0 0 3px 3px}
.id .card{position:relative;width:100%;background:var(--card);border-radius:16px;padding:1.6rem 1rem 1.3rem;margin-top:-6px;text-align:center;box-shadow:0 14px 30px rgba(28,36,56,.16);border-top:6px solid var(--blue);transition:transform .3s}
.id:hover .card{transform:translateY(-6px)}
.id:nth-child(even) .strap{background:var(--sand)}.id:nth-child(even) .card{border-top-color:var(--sand)}
.id:nth-child(odd){animation:swing 6s ease-in-out infinite}.id:nth-child(even){animation:swing 7s ease-in-out infinite reverse}
.card::before{content:'';position:absolute;top:8px;left:50%;width:34px;height:6px;margin-left:-17px;border-radius:4px;background:var(--line)}
.avatar{width:112px;height:112px;border-radius:50%;margin:.6rem auto .9rem;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:800;overflow:hidden;border:4px solid var(--sand)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:1.5rem;font-weight:800;line-height:1.2}
.card .role{font-size:.8rem;color:var(--mute)}
.card .no{font-size:.7rem;color:var(--mute);letter-spacing:.08em;margin-top:.6rem}
.card .barcode{margin:.5rem auto 0;width:70%;height:26px}
.card .stamp{position:absolute;left:50%;top:46%;font-size:1.1rem;white-space:nowrap;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}
.id.signed .stamp{animation:stampIn .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stampIn{to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}

/* ── GALERI ── */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.gal .slot{border-radius:14px;cursor:zoom-in;background:#fff;box-shadow:0 8px 20px rgba(28,36,56,.12)}
.gal .slot img{width:100%;height:auto;object-fit:contain}
.gal .slot.empty{aspect-ratio:4/3}
#lb{position:fixed;inset:0;background:rgba(14,18,30,.93);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:92vw;max-height:88vh;border-radius:10px}

/* ── VIDEO ── */
#videos{padding-top:5rem}
.vids{display:grid;grid-template-columns:1fr;gap:1.4rem}
@media(min-width:720px){.vids{grid-template-columns:1fr 1fr}}
.vid{background:var(--card);border-radius:16px;padding:.7rem .7rem 1rem;box-shadow:0 14px 30px rgba(28,36,56,.14)}
.vid .frame{position:relative;border-radius:10px;overflow:hidden;background:#0e121e;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.vid video{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;background:transparent;pointer-events:none}
.vid .bg{position:absolute;inset:0;width:100%;height:100%;filter:blur(18px) brightness(.75);transform:scale(1.3)}
.vid.empty .frame::after{content:attr(data-path);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:.5rem;font-size:.75rem;color:#aab4cc;border:2px dashed #55607c;word-break:break-all;border-radius:10px}
.vid.empty video{visibility:hidden}
.vid p{margin-top:.7rem;font-size:1.35rem;line-height:1.2;text-align:center}

/* ── SURAT ── */
#letter{background:var(--ink);max-width:none;padding:5rem 1.25rem}
.paper{max-width:620px;margin:auto;background:var(--card);padding:2.4rem 2rem;border-radius:6px;box-shadow:8px 8px 0 var(--blue);background-image:repeating-linear-gradient(transparent 0 31px,#e6e9f0 31px 32px)}
.paper p{white-space:pre-line;line-height:32px}
.paper .sign{text-align:right;font-size:1.8rem;margin-top:1rem;line-height:1.2}

/* ── PENUTUP ── */
#end{text-align:center;min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#end h2{font-size:clamp(2.4rem,9vw,5.5rem)}
.btn{margin-top:2rem;padding:1rem 2.4rem;border:3px solid var(--ink);background:var(--ink);color:#fff;font:800 1rem 'Bricolage Grotesque';border-radius:50px;cursor:pointer;box-shadow:5px 5px 0 var(--blue);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--blue)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.rv{opacity:0;transform:translateY(20px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.badge,.id{animation:none!important}.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>

<script>
/* ════════════════════════════════════════════
   ✏️ EDIT DI SINI SAJA
   Taruh foto di folder "foto" (sebelah index.html).
   Foto belum ada = muncul kotak putus-putus berisi nama file.
   Isi surat di bawah hanya CONTOH, ganti dengan kata-katamu sendiri.
═════════════════════════════════════════════ */
const DATA = {
  fotoBersama: "foto/bersama.jpeg",
  kartuJudul: "Adik-adik PKL × Kakak-kakak Magang",
  tempat: "DISDUKCAPIL KOTA BOGOR",
  periode: "OKTOBER - NOVEMBER 2026",

  judul: "Terima kasih & sampai jumpa, adik-adik!",
  subjudul: "Dari kami, anak magang, untuk adik-adik PKL yang bikin hari-hari jadi lebih rame.",
  dari: "Kakak-kakak magang",

  adik: [
    { nama: "Nahla",  foto: "foto/nahla.png" },
    { nama: "Nurul",  foto: "foto/nurul.png" },
    { nama: "Laura",  foto: "foto/laura.png" },
    { nama: "Balqis", foto: "foto/balqis.png" },
    { nama: "Pia",    foto: "foto/pia.png" }
  ],

  galeri: ["foto/foto1.jpeg","foto/foto2.jpeg","foto/foto3.jpeg"],

  // Video: taruh file di folder "video" (mp4 paling aman). poster = gambar sampul (boleh dikosongkan "")
  video: [
    { src: "video/video1.mp4", poster: "" },
    { src: "video/video2.mp4", poster: "" }
  ],

  surat: `Untuk Nahla, Nurul, Laura, Balqis, dan Pia,

Terima kasih sudah jadi bagian dari hari-hari kami selama magang. Kalian rajin, kalian lucu, dan kalian bikin suasana capil jadi lebih gokil.

Maaf kadang kita suka ngeroasting, atau ngebully. Semoga jadi kenangan lucu buat kalian juga.

Jangan berhenti belajar, jangan takut nanya, dan jangan lupa kabar-kabarin kami kalau sudah sukses nanti.`,
  penutup: "Sampai jumpa lagi!"
};
</script>

<section id="hero">
  <div class="lanyard"></div>
  <div class="badge" id="badge" title="Klik untuk membalik">
    <div class="inner">
      <div class="face front">
        <div class="photo slot" id="heroPhoto"></div>
        <b id="hKartu"></b><small id="hTempat"></small><br><small id="hPeriode"></small>
      </div>
      <div class="face back">
        <small>Status kartu</small>
        <div class="stamp">SELESAI</div>
        <div class="big">Terima kasih<br>sudah jadi bagian kami</div>
        <div class="barcode"></div>
      </div>
    </div>
  </div>
  <h1 id="hJudul"></h1>
  <p id="hSub"></p>
  <p class="hint hand">↓ klik kartunya untuk dibalik, lalu scroll ↓</p>
</section>

<section id="adik">
  <h2 class="rv">Adik-adik PKL kami</h2>
  <p class="lead rv">Especially buat Lima nama yang bakal ngangenin bangett. Klik kartunya ya adik adik, buat dicap.</p>
  <div class="ids" id="ids"></div>
</section>

<section id="gallery">
  <h2 class="rv">Album kenangan</h2>
  <p class="lead rv">Klik foto untuk memperbesar.</p>
  <div class="gal" id="gal"></div>
</section>

<section id="letter">
  <div class="paper rv"><p id="suratTxt"></p><p class="sign hand" id="suratSign"></p></div>
</section>

<section id="videos">
  <h2 class="rv">Sedikit Video kenangan</h2>
  <div class="vids" id="vids"></div>
</section>

<section id="end">
  <h2 class="rv" id="endTxt"></h2>
  <p class="lead rv hand" style="font-size:1.7rem;margin:1rem 0 0" id="endFrom"></p>
  <button class="btn" id="party">Cap semua kartu & lempar konfeti</button>
</section>

<div id="lb"><img alt=""></div>
<canvas id="confetti"></canvas>

<script>
const $ = s => document.querySelector(s);
const fill = (host, src) => { host.classList.add('slot'); host.dataset.path = src; const i = new Image(); i.alt=''; i.onload = () => host.prepend(i); i.onerror = () => host.classList.add('empty'); i.src = src; };

document.title = DATA.judul;
$('#hKartu').textContent = DATA.kartuJudul;
$('#hTempat').textContent = DATA.tempat;
$('#hPeriode').textContent = DATA.periode;
$('#hJudul').textContent = DATA.judul;
$('#hSub').textContent = DATA.subjudul;
$('#suratTxt').textContent = DATA.surat;
$('#suratSign').textContent = '— ' + DATA.dari;
$('#endTxt').textContent = DATA.penutup;
$('#endFrom').textContent = DATA.dari + ' ♡';
fill($('#heroPhoto'), DATA.fotoBersama);

DATA.adik.forEach(({nama, foto}, i) => {
  const el = document.createElement('div'); el.className = 'id rv';
  el.innerHTML = `<div class="strap"></div><div class="card"><div class="avatar">${nama[0]}</div><h3>${nama}</h3><div class="role">Adik PKL</div><div class="barcode"></div><div class="no">PKL-${String(i+1).padStart(2,'0')}</div><div class="stamp">TERIMA KASIH</div></div>`;
  const av = el.querySelector('.avatar'), im = new Image(); im.alt = nama;
  im.onload = () => { av.textContent = ''; av.appendChild(im); }; im.src = foto;
  el.onclick = () => el.classList.toggle('signed');
  $('#ids').appendChild(el);
});

DATA.galeri.forEach(src => {
  const s = document.createElement('div'); fill(s, src);
  s.onclick = () => { if (s.classList.contains('empty')) return; $('#lb img').src = src; $('#lb').classList.add('on'); };
  $('#gal').appendChild(s);
});
DATA.video.forEach(v => {
  const el = document.createElement('div'); el.className = 'vid rv';
  el.innerHTML = `<div class="frame" data-path="${v.src}"><canvas class="bg" width="64" height="36"></canvas><video muted loop autoplay playsinline disablepictureinpicture preload="auto"${v.poster ? ` poster="${v.poster}"` : ''}></video></div>${v.judul ? `<p class="hand">${v.judul}</p>` : ''}`;
  const vd = el.querySelector('video');
  vd.onerror = () => el.classList.add('empty');
  vd.muted = true; vd.loop = true;
  const bg = el.querySelector('.bg'), bx = bg.getContext('2d');
  const paint = () => {
    if (vd.videoWidth) { const k = Math.max(64/vd.videoWidth, 36/vd.videoHeight), w = vd.videoWidth*k, h = vd.videoHeight*k; bx.drawImage(vd, (64-w)/2, (36-h)/2, w, h); }
    if (!vd.paused && !vd.ended) requestAnimationFrame(paint);
  };
  vd.addEventListener('play', paint); vd.addEventListener('loadeddata', paint);
  new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? vd.play().catch(()=>{}) : vd.pause()), {threshold:.25}).observe(vd);
  vd.src = v.src;
  $('#vids').appendChild(el);
});
$('#lb').onclick = () => $('#lb').classList.remove('on');
addEventListener('keydown', e => e.key === 'Escape' && $('#lb').classList.remove('on'));

$('#badge').onclick = () => { const b = $('#badge'); const was = b.classList.contains('flipped'); b.classList.toggle('flipped'); if (!was) setTimeout(() => $('#adik').scrollIntoView({behavior:'smooth'}), 2200); };

const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), {threshold:.15});
document.querySelectorAll('.rv').forEach(e => io.observe(e));

/* konfeti */
const cv = $('#confetti'), cx = cv.getContext('2d'); let bits = [], run = false;
const size = () => { cv.width = innerWidth; cv.height = innerHeight }; size(); addEventListener('resize', size);
$('#party').onclick = () => {
  document.querySelectorAll('.id').forEach((e,i) => setTimeout(() => e.classList.add('signed'), i*180));
  const cols = ['#7f9cc0','#d9b98a','#b86f62','#1c2438','#fff'];
  for (let i = 0; i < 160; i++) bits.push({x: innerWidth/2, y: innerHeight*.7, vx:(Math.random()-.5)*16, vy:-8-Math.random()*12, s:5+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[i%5]});
  if (!run) { run = true; tick(); }
};
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b => { b.x+=b.vx; b.y+=b.vy; b.vy+=.35; b.vx*=.99; b.r+=b.vr; cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle=b.c; cx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); cx.restore(); });
  bits = bits.filter(b => b.y < cv.height + 20);
  if (bits.length) requestAnimationFrame(tick); else { run = false; cx.clearRect(0,0,cv.width,cv.height); }
}
</script>
</body>
</html>
